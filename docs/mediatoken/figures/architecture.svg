<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">MediaToken five-layer architecture</title>
<desc id="desc">Five layers: social, local library, attention market, identity, and content.</desc>
<defs>
 <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#faf8f3"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
 <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-opacity=".10"/></filter>
</defs>
<rect width="1200" height="760" rx="28" fill="url(#bg2)"/>
<text x="88" y="72" fill="#0b1020" font-family="system-ui,sans-serif" font-size="31" font-weight="800">Five layers, one cultural object</text>
<text x="88" y="108" fill="#5c687b" font-family="system-ui,sans-serif" font-size="18">The release remains portable across apps, markets, libraries, and communities.</text>
<g filter="url(#s)" font-family="system-ui,sans-serif">
 <rect x="86" y="145" width="820" height="96" rx="18" fill="#fff" stroke="#91a2bb"/>
 <rect x="86" y="145" width="19" height="96" rx="9" fill="#6aa9ff"/>
 <text x="139" y="184" fill="#0b1020" font-size="25" font-weight="750">Social layer</text>
 <text x="139" y="216" fill="#59667a" font-size="17">Discovery · curation · collections · conversation · community</text>
 <rect x="939" y="169" width="166" height="45" rx="22" fill="#e5efff"/>
 <text x="1022" y="197" text-anchor="middle" fill="#315d99" font-size="15" font-weight="700">OPEN GRAPH</text>

 <rect x="86" y="257" width="820" height="96" rx="18" fill="#fff" stroke="#65b99e"/>
 <rect x="86" y="257" width="19" height="96" rx="9" fill="#60dfb5"/>
 <text x="139" y="296" fill="#0b1020" font-size="25" font-weight="750">Library layer</text>
 <text x="139" y="328" fill="#59667a" font-size="17">Keep · play offline · export · remove · share through IPFS</text>
 <rect x="939" y="281" width="166" height="45" rx="22" fill="#ddf7ee"/>
 <text x="1022" y="309" text-anchor="middle" fill="#27735d" font-size="15" font-weight="700">USER-OWNED</text>

 <rect x="86" y="369" width="820" height="96" rx="18" fill="#fff" stroke="#d4a657"/>
 <rect x="86" y="369" width="19" height="96" rx="9" fill="#ffc66c"/>
 <text x="139" y="408" fill="#0b1020" font-size="25" font-weight="750">Attention-market layer</text>
 <text x="139" y="440" fill="#59667a" font-size="17">Reserve curve · creator fees · community treasury · curation</text>
 <rect x="939" y="393" width="166" height="45" rx="22" fill="#fff1d8"/>
 <text x="1022" y="421" text-anchor="middle" fill="#85601f" font-size="15" font-weight="700">ON-CHAIN</text>

 <rect x="86" y="481" width="820" height="96" rx="18" fill="#fff" stroke="#b287ce"/>
 <rect x="86" y="481" width="19" height="96" rx="9" fill="#c88df3"/>
 <text x="139" y="520" fill="#0b1020" font-size="25" font-weight="750">Identity layer</text>
 <text x="139" y="552" fill="#59667a" font-size="17">Signed release registry · Token-2022 mint · locked metadata</text>
 <rect x="939" y="505" width="166" height="45" rx="22" fill="#f1e5fa"/>
 <text x="1022" y="533" text-anchor="middle" fill="#70458e" font-size="15" font-weight="700">VERIFIABLE</text>

 <rect x="86" y="593" width="820" height="96" rx="18" fill="#fff" stroke="#e3937c"/>
 <rect x="86" y="593" width="19" height="96" rx="9" fill="#ff795d"/>
 <text x="139" y="632" fill="#0b1020" font-size="25" font-weight="750">Content layer</text>
 <text x="139" y="664" fill="#59667a" font-size="17">Canonical manifest · media CIDs · creator signature · lineage</text>
 <rect x="939" y="617" width="166" height="45" rx="22" fill="#ffe7e0"/>
 <text x="1022" y="645" text-anchor="middle" fill="#9a4935" font-size="15" font-weight="700">IMMUTABLE</text>
</g>
<path d="M932 145v544" stroke="#c4ccd7" stroke-width="2" stroke-dasharray="6 8"/>
</svg>