<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regard — The Factory — Matthew Joseph Taylor</title>
  <meta name="description" content="Regard — an interactive 3D sculpture built from 12,952 ghostly SVG paths. Part of The Factory series by Matthew Joseph Taylor.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #040201; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #555; font-family: monospace; font-size: 13px;
      z-index: 10; background: #040201;
    }
    #start {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #666; font-family: monospace; font-size: 15px;
      z-index: 20; background: #040201; cursor: pointer;
      letter-spacing: 0.1em;
    }
    #start:hover { color: #999; }
    #vignette {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 4;
      background: radial-gradient(ellipse at center,
        transparent 30%,
        rgba(4,2,1,0.25) 60%,
        rgba(4,2,1,0.75) 100%);
    }
    #nav {
      position: fixed; top: 14px; left: 18px;
      z-index: 5; pointer-events: auto;
    }
    #nav a {
      color: rgba(255,255,255,0.2);
      font-family: monospace; font-size: 11px;
      text-decoration: none; letter-spacing: 0.05em;
      transition: color 150ms;
    }
    #nav a:hover { color: rgba(255,255,255,0.5); }
    #info {
      position: fixed; bottom: 12px; left: 18px;
      color: rgba(255,255,255,0.12);
      font-family: monospace; font-size: 10px;
      z-index: 5; pointer-events: none;
    }
    #signature {
      position: fixed; bottom: 14px; right: 18px;
      color: rgba(255,255,255,0.08);
      font-family: monospace; font-size: 10px;
      letter-spacing: 0.15em;
      z-index: 5; pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/tone@15.1.5/build/Tone.js"></script>
</head>
<body>
  <div id="start">click to enter</div>
  <div id="loading">loading paths…</div>
  <div id="vignette"></div>
  <div id="nav"><a href="../">&larr; The Factory</a></div>
  <div id="info">drag to orbit · scroll to zoom</div>
  <div id="signature">MJT · 2026</div>
  <script type="module" src="main.js"></script>
</body>
</html>
