<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Personal libraries form the distribution network</title>
<desc id="desc">People keep overlapping collections of media on devices they control. IPFS lets those devices exchange exact content, without a storage registry or hosting reward.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#faf8f3"/><stop offset="1" stop-color="#edf2f6"/></linearGradient>
 <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".12"/></filter>
 <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#74869d"/></marker>
</defs>
<rect width="1200" height="760" rx="28" fill="url(#bg)"/>
<text x="72" y="70" fill="#0b1020" font-family="system-ui,sans-serif" font-size="31" font-weight="800">The libraries are the network</text>
<text x="72" y="107" fill="#5f6b7b" font-family="system-ui,sans-serif" font-size="18">People keep what they care about. IPFS makes those ordinary copies mutually useful.</text>
<g fill="none" stroke="#74869d" stroke-width="3" marker-start="url(#arr)" marker-end="url(#arr)" opacity=".8">
 <path d="M360 300 C470 210 610 205 728 278"/>
 <path d="M354 391 C464 506 611 521 735 442"/>
 <path d="M838 350 C902 353 948 354 994 354"/>
</g>
<g filter="url(#s)" font-family="system-ui,sans-serif">
 <rect x="76" y="176" width="290" height="313" rx="24" fill="#fff" stroke="#6aa9ff"/>
 <rect x="76" y="176" width="290" height="62" rx="24" fill="#152743"/>
 <text x="106" y="216" fill="#fff" font-size="22" font-weight="750">Maya's library</text>
 <g>
  <rect x="105" y="266" width="70" height="70" rx="14" fill="#ffe4dc"/><text x="140" y="309" text-anchor="middle" fill="#9b4a35" font-size="24" font-weight="800">A</text>
  <text x="194" y="293" fill="#0b1020" font-size="17" font-weight="700">Short film</text><text x="194" y="317" fill="#718095" font-size="14">kept locally</text>
  <rect x="105" y="351" width="70" height="70" rx="14" fill="#e4f8f1"/><text x="140" y="394" text-anchor="middle" fill="#26705a" font-size="24" font-weight="800">B</text>
  <text x="194" y="378" fill="#0b1020" font-size="17" font-weight="700">Essay</text><text x="194" y="402" fill="#718095" font-size="14">kept locally</text>
 </g>
 <text x="105" y="459" fill="#6a778a" font-size="14">chooses what stays</text>

 <rect x="732" y="176" width="290" height="313" rx="24" fill="#fff" stroke="#c88df3"/>
 <rect x="732" y="176" width="290" height="62" rx="24" fill="#152743"/>
 <text x="762" y="216" fill="#fff" font-size="22" font-weight="750">Jon's library</text>
 <g>
  <rect x="761" y="266" width="70" height="70" rx="14" fill="#ffe4dc"/><text x="796" y="309" text-anchor="middle" fill="#9b4a35" font-size="24" font-weight="800">A</text>
  <text x="850" y="293" fill="#0b1020" font-size="17" font-weight="700">Short film</text><text x="850" y="317" fill="#718095" font-size="14">same CID</text>
  <rect x="761" y="351" width="70" height="70" rx="14" fill="#fff0d7"/><text x="796" y="394" text-anchor="middle" fill="#85601f" font-size="24" font-weight="800">C</text>
  <text x="850" y="378" fill="#0b1020" font-size="17" font-weight="700">Album</text><text x="850" y="402" fill="#718095" font-size="14">kept locally</text>
 </g>
 <text x="761" y="459" fill="#6a778a" font-size="14">may remove either work</text>

 <circle cx="548" cy="353" r="113" fill="#142440" stroke="#60dfb5" stroke-width="3"/>
 <circle cx="548" cy="353" r="82" fill="#1c3150"/>
 <text x="548" y="340" text-anchor="middle" fill="#60dfb5" font-size="18" font-weight="800" letter-spacing="2">IPFS</text>
 <text x="548" y="373" text-anchor="middle" fill="#fff" font-size="22" font-weight="750">exact bytes</text>
 <text x="548" y="400" text-anchor="middle" fill="#aebed2" font-size="14">peer to peer</text>

 <rect x="996" y="286" width="137" height="137" rx="68" fill="#fff" stroke="#ffc66c" stroke-width="3"/>
 <text x="1064" y="337" text-anchor="middle" fill="#85601f" font-size="14" font-weight="800">TOKEN</text>
 <text x="1064" y="367" text-anchor="middle" fill="#0b1020" font-size="17" font-weight="750">optional</text>
 <text x="1064" y="391" text-anchor="middle" fill="#718095" font-size="12">separate state</text>
</g>
<rect x="75" y="568" width="1058" height="116" rx="20" fill="#fff" stroke="#c9d1dc"/>
<text x="104" y="608" fill="#0b1020" font-family="system-ui,sans-serif" font-size="18" font-weight="800">NO HOSTING MARKET</text>
<text x="104" y="638" fill="#5f6b7b" font-family="system-ui,sans-serif" font-size="17">No registration · no proof of retention · no bandwidth meter · no payment for keeping bytes.</text>
<text x="104" y="666" fill="#5f6b7b" font-family="system-ui,sans-serif" font-size="17">Availability rises and falls with actual possession, affection, and ordinary peer sharing.</text>
</svg>